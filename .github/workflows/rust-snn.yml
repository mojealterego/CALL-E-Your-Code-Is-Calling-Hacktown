name: Rust SNN

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  snn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/snn-zenoh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo check --features zenoh-transport
