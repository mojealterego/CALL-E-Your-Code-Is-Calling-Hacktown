[package]
name = "aegisfleet-snn-zenoh"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded spiking-neural fast path for AegisFleet with an explicit 1ms budget and optional Zenoh transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zenoh = { version = "1", optional = true }

[features]
default = []
zenoh-transport = ["dep:zenoh"]

[[bin]]
name = "snn-zenoh"
path = "src/main.rs"
