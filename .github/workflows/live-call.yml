name: LIVE CALL-E Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicitly authorize ONE live CALL-E test call"
        required: true
        type: choice
        options:
          - I AUTHORIZE ONE TEST CALL

permissions:
  contents: read

jobs:
  live-call:
    if: ${{ inputs.confirmation == 'I AUTHORIZE ONE TEST CALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALLE_API_KEY: ${{ secrets.CALLE_API_KEY }}
      CALL_E_MODE: live
      AEGIS_LIVE_PHONE: ${{ secrets.AEGIS_LIVE_PHONE }}
      AEGIS_LIVE_TEST_ID: ${{ github.run_id }}
      CALLE_REGION: PL
      CALLE_LOCALE: pl-PL
      CALLE_BASE_URL: https://api.heycall-e.com
    steps:
      - name: Checkout tested feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/voice-transaction-core-v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$CALLE_API_KEY" || { echo "CALLE_API_KEY secret is missing"; exit 1; }
          test -n "$AEGIS_LIVE_PHONE" || { echo "AEGIS_LIVE_PHONE secret is missing"; exit 1; }
          printf '%s' "$AEGIS_LIVE_PHONE" | grep -Eq '^\+[1-9][0-9]{7,14}$' || { echo "AEGIS_LIVE_PHONE must be E.164"; exit 1; }
      - name: Preflight CALL-E authentication without placing a call
        shell: bash
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST 'https://api.heycall-e.com/v1/calls' \
            -H 'Authorization: Bearer '"$CALLE_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}')
          case "$status" in
            400|422) echo "CALL-E authentication accepted; malformed preflight request rejected as expected." ;;
            401|403) echo "CALL-E rejected CALLE_API_KEY."; exit 1 ;;
            *) echo "Unexpected CALL-E preflight HTTP status: $status"; exit 1 ;;
          esac
      - name: Run regression tests
        run: npm test
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Run exactly one live transaction
        run: npm run live
